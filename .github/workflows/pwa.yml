name: Personal scan viewer

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ahmedalhulaibi/dwv'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: npm install -g corepack && corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn lint-pwa
      - run: yarn test-ci
      - run: yarn build-ci
      - run: yarn build-pwa
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/pwa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy viewer
        id: deployment
        uses: actions/deploy-pages@v4
